version: "3.9"

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: goairclass_mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend (Express) ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/onlinegologistics/goairclass_v3-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goairclass_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    image: ghcr.io/onlinegologistics/goairclass_v3-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: goairclass_frontend
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      - backend

  # ── Nginx (Reverse Proxy + SSL Termination) ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: goairclass_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - app_network
    depends_on:
      - backend
      - frontend

  # ── Certbot (SSL certificate renewal) ────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: goairclass_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Renew every 12 hours; certbot skips if cert is still fresh
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mongo_data:
  uploads_data:
  certbot_certs:
  certbot_webroot:

networks:
  app_network:
    driver: bridge
