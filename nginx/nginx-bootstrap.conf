# Temporary config used ONLY for the first SSL certificate issuance.
# After certbot succeeds, switch to nginx.conf and restart nginx.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend  { server backend:5000; }
    upstream frontend { server frontend:80;  }

    server {
        listen 80;
        server_name goairclass.com www.goairclass.com goairclass.in www.goairclass.in;

        # ACME challenge — certbot writes files here
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Serve app over plain HTTP temporarily
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
