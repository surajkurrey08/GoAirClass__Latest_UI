name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Lint & Basic Check ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin-frontend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Frontend build check
        run: npm run build
        working-directory: frontend

      - name: Install admin frontend deps
        run: npm ci
        working-directory: admin-frontend

      - name: Admin frontend build check
        run: npm run build
        working-directory: admin-frontend

  # ── 2. Build & Push Docker Images ─────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    # Only build+push on main branch pushes (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.meta_backend.outputs.tags }}
      frontend_image: ${{ steps.meta_frontend.outputs.tags }}
      admin_frontend_image: ${{ steps.meta_admin_frontend.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Docker meta — backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - name: Docker meta — frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: VITE_API_URL=https://goairclass.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Admin frontend image (admin.goairclass.com)
      - name: Docker meta — admin frontend
        id: meta_admin_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push admin frontend
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          push: true
          tags: ${{ steps.meta_admin_frontend.outputs.tags }}
          labels: ${{ steps.meta_admin_frontend.outputs.labels }}
          # Empty VITE_API_URL → same-origin /api (nginx proxies it on the admin domain)
          build-args: VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # .env is regenerated from GitHub Secrets on every deploy, so adding a new
      # secret here is the ONLY step needed going forward — no VPS access required.
      - name: Ensure VPS firewall allows web traffic
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            if command -v ufw >/dev/null 2>&1; then
              ufw allow OpenSSH >/dev/null 2>&1 || true
              ufw allow 80/tcp >/dev/null 2>&1 || true
              ufw allow 443/tcp >/dev/null 2>&1 || true
              ufw --force enable
            else
              echo "ufw not available; skipping firewall configuration"
            fi

      - name: Write .env from GitHub Secrets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: MONGO_ROOT_USER,MONGO_ROOT_PASS,MONGO_URI,JWT_SECRET,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,FRONTEND_URL,CRM_API_URL,CRM_API_KEY
          script: |
            set -e
            mkdir -p /opt/goairclass
            cat > /opt/goairclass/.env <<EOF
            NODE_ENV=production
            PORT=5000

            MONGO_ROOT_USER=$MONGO_ROOT_USER
            MONGO_ROOT_PASS=$MONGO_ROOT_PASS
            MONGO_URI=$MONGO_URI

            JWT_SECRET=$JWT_SECRET

            RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID
            RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET

            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS

            FRONTEND_URL=$FRONTEND_URL

            CRM_API_URL=$CRM_API_URL
            CRM_API_KEY=$CRM_API_KEY
            EOF
            chmod 600 /opt/goairclass/.env
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASS: ${{ secrets.MONGO_ROOT_PASS }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: CERTBOT_EMAIL
          command_timeout: 20m
          script: |
            set -e

            PROJECT=goairclass
            APP_DIR=/opt/goairclass

            # ── Sync repo ────────────────────────────────────────────────────
            # Hard-reset instead of pull, so leftovers from an interrupted
            # deploy (e.g. a half-finished nginx.conf swap) can never break
            # future deploys with merge conflicts. .env is untracked → safe.
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Login to GHCR and pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend frontend admin_frontend

            # ── Self-heal: remove containers that hold our names but belong
            # to a different compose project (compose run from another clone
            # of the repo) or were started by hand with `docker run`. Compose
            # cannot see them, so `up` dies with "container name already in
            # use" until they are gone. For stateful services the foreign
            # container may hold the LIVE data in a differently-named volume —
            # migrate that data into the canonical volume before removing the
            # container. The foreign volume itself is never deleted, and the
            # canonical volume is tar-backed-up to $APP_DIR/backups before
            # being overwritten.
            vol_of() {
              docker inspect -f "{{ range .Mounts }}{{ if eq .Destination \"$2\" }}{{ .Name }}{{ end }}{{ end }}" "$1" 2>/dev/null || true
            }
            migrate_volume() {
              src="$1"; dst="$2"
              if [ -z "$src" ] || [ "$src" = "$dst" ]; then return 0; fi
              echo "Migrating data volume '$src' -> '$dst'"
              docker volume create "$dst" >/dev/null
              mkdir -p "$APP_DIR/backups"
              docker run --rm -v "$dst":/v:ro -v "$APP_DIR/backups":/b alpine:3 \
                tar czf "/b/$dst-$(date +%Y%m%d-%H%M%S).tgz" -C /v . || true
              docker run --rm -v "$src":/from:ro -v "$dst":/to alpine:3 \
                sh -c 'find /to -mindepth 1 -delete && cp -a /from/. /to/'
            }
            for name in goairclass_mongo goairclass_backend goairclass_frontend goairclass_admin_frontend goairclass_nginx goairclass_certbot; do
              cid=$(docker ps -aq --filter "name=^/?${name}$" | head -n1)
              [ -z "$cid" ] && continue
              owner=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$cid" 2>/dev/null || true)
              [ "$owner" = "$PROJECT" ] && continue
              running=$(docker inspect -f '{{ .State.Running }}' "$cid" 2>/dev/null || true)
              echo "Conflicting container $name ($cid) from project '${owner:-<none>}' (running: $running) — removing"
              case "$name" in
                goairclass_mongo)   data_path=/data/db;     canon="${PROJECT}_mongo_data"   ;;
                goairclass_backend) data_path=/app/uploads; canon="${PROJECT}_uploads_data" ;;
                *)                  data_path="" ;;
              esac
              if [ -n "$data_path" ]; then
                src=$(vol_of "$cid" "$data_path")
                if [ "$running" = "true" ] || ! docker volume inspect "$canon" >/dev/null 2>&1; then
                  docker stop "$cid" >/dev/null 2>&1 || true
                  migrate_volume "$src" "$canon"
                fi
              fi
              docker rm -f "$cid" >/dev/null
            done

            # ── nginx helpers ────────────────────────────────────────────────
            free_web_ports() {
              # Only remove port-holders that are NOT ours; compose manages
              # its own nginx cleanly once strays are gone.
              ids=$( { docker ps -q --filter "publish=80"; docker ps -q --filter "publish=443"; } | sort -u)
              for id in $ids; do
                owner=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$id" 2>/dev/null || true)
                if [ "$owner" != "$PROJECT" ]; then
                  echo "Force-removing stray container holding port 80/443: $id"
                  docker rm -f "$id" >/dev/null 2>&1 || true
                fi
              done
            }
            restart_nginx() {
              # nginx.conf is bind-mounted as a single file; git replaces the
              # inode on update, so a running container keeps seeing the OLD
              # content. Recreating the container is the only reliable way to
              # apply config changes.
              free_web_ports
              docker compose rm -sf nginx >/dev/null 2>&1 || true
              docker compose up -d --no-build --no-deps nginx
            }
            admin_cert_exists() {
              docker run --rm -v "${PROJECT}_certbot_certs":/le:ro alpine:3 \
                test -d /le/live/admin.goairclass.com >/dev/null 2>&1
            }

            # ── One-time SSL bootstrap for admin.goairclass.com ──────────────
            # Check the cert on the shared volume directly, so the check works
            # whether or not nginx happens to be running right now. If the
            # cert is missing, serve plain HTTP (bootstrap config) instead of
            # letting nginx crash-loop on missing cert files.
            BOOTSTRAP=no
            if ! admin_cert_exists; then
              BOOTSTRAP=yes
              echo "admin.goairclass.com cert not found — bootstrapping over plain HTTP..."
              cp nginx/nginx-bootstrap.conf nginx/nginx.conf
            fi

            # ── Deploy: recreate anything whose image or config changed ──────
            free_web_ports
            docker compose up -d --no-build --remove-orphans
            restart_nginx

            if [ "$BOOTSTRAP" = "yes" ]; then
              sleep 5
              # --entrypoint overrides the service's renew-loop entrypoint,
              # which would otherwise ignore the certonly args and hang forever
              timeout 180 docker compose run --rm --entrypoint certbot certbot certonly \
                --webroot -w /var/www/certbot \
                -d admin.goairclass.com \
                --email "$CERTBOT_EMAIL" --agree-tos --no-eff-email --non-interactive \
                || echo "WARNING: admin.goairclass.com cert issuance failed — check that admin.goairclass.com DNS points to this VPS. Will retry next deploy."
              if admin_cert_exists; then
                git checkout -- nginx/nginx.conf
                restart_nginx
              else
                echo "WARNING: still no admin cert — leaving HTTP-only bootstrap config active"
              fi
            fi

            # Cleanup old images
            docker image prune -f

            # ── Verify ───────────────────────────────────────────────────────
            docker compose ps
            sleep 5
            if curl -fsS -o /dev/null --max-time 15 http://127.0.0.1/; then
              echo "OK: port 80 responding"
            else
              echo "FAIL: site not responding on port 80 — recent logs:"
              docker compose logs --tail=50 nginx backend || true
              exit 1
            fi
            if curl -fsS -o /dev/null --max-time 15 --resolve goairclass.com:443:127.0.0.1 https://goairclass.com/; then
              echo "OK: https://goairclass.com responding"
            else
              echo "WARNING: HTTPS check failed (expected only while certs are still being bootstrapped)"
            fi
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
