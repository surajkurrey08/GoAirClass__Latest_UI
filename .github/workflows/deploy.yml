name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Lint & Basic Check ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin-frontend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Frontend build check
        run: npm run build
        working-directory: frontend

      - name: Install admin frontend deps
        run: npm ci
        working-directory: admin-frontend

      - name: Admin frontend build check
        run: npm run build
        working-directory: admin-frontend

  # ── 2. Build & Push Docker Images ─────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    # Only build+push on main branch pushes (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.meta_backend.outputs.tags }}
      frontend_image: ${{ steps.meta_frontend.outputs.tags }}
      admin_frontend_image: ${{ steps.meta_admin_frontend.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Docker meta — backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - name: Docker meta — frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: VITE_API_URL=https://goairclass.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Admin frontend image (admin.goairclass.com)
      - name: Docker meta — admin frontend
        id: meta_admin_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push admin frontend
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          push: true
          tags: ${{ steps.meta_admin_frontend.outputs.tags }}
          labels: ${{ steps.meta_admin_frontend.outputs.labels }}
          # Empty VITE_API_URL → same-origin /api (nginx proxies it on the admin domain)
          build-args: VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # .env is regenerated from GitHub Secrets on every deploy, so adding a new
      # secret here is the ONLY step needed going forward — no VPS access required.
      - name: Ensure VPS firewall allows web traffic
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            if command -v ufw >/dev/null 2>&1; then
              ufw allow OpenSSH >/dev/null 2>&1 || true
              ufw allow 80/tcp >/dev/null 2>&1 || true
              ufw allow 443/tcp >/dev/null 2>&1 || true
              ufw --force enable
            else
              echo "ufw not available; skipping firewall configuration"
            fi

      - name: Write .env from GitHub Secrets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: MONGO_ROOT_USER,MONGO_ROOT_PASS,MONGO_URI,JWT_SECRET,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,FRONTEND_URL,CRM_API_URL,CRM_API_KEY
          script: |
            set -e
            mkdir -p /opt/goairclass
            cat > /opt/goairclass/.env <<EOF
            NODE_ENV=production
            PORT=5000

            MONGO_ROOT_USER=$MONGO_ROOT_USER
            MONGO_ROOT_PASS=$MONGO_ROOT_PASS
            MONGO_URI=$MONGO_URI

            JWT_SECRET=$JWT_SECRET

            RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID
            RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET

            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS

            FRONTEND_URL=$FRONTEND_URL

            CRM_API_URL=$CRM_API_URL
            CRM_API_KEY=$CRM_API_KEY
            EOF
            chmod 600 /opt/goairclass/.env
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASS: ${{ secrets.MONGO_ROOT_PASS }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: CERTBOT_EMAIL
          command_timeout: 20m
          script: |
            set -e

            # Clone repo if not present, otherwise pull latest
            if [ ! -d /opt/goairclass ]; then
              git clone https://github.com/${{ github.repository }}.git /opt/goairclass
            fi
            cd /opt/goairclass
            git pull origin main

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose pull backend frontend admin_frontend

            # ── One-time SSL bootstrap for admin.goairclass.com ──────────────
            # Something on this VPS keeps holding on to ports 80/443 even after
            # `docker compose stop/rm` on the nginx service — almost certainly a
            # stray/orphaned container left over from earlier failed deploy
            # attempts, not necessarily named goairclass_nginx. So: find and
            # force-remove *any* container publishing 80 or 443, unconditionally,
            # before ever starting nginx. This is the only thing guaranteed to
            # free the ports regardless of what's holding them.
            free_web_ports() {
              ids=$(docker ps -q --filter "publish=80" ; docker ps -q --filter "publish=443")
              if [ -n "$ids" ]; then
                echo "Force-removing containers holding port 80/443: $ids"
                docker rm -f $ids 2>/dev/null || true
              fi
              sleep 2
            }

            CERT_EXISTS=no
            docker compose exec -T nginx test -d /etc/letsencrypt/live/admin.goairclass.com 2>/dev/null && CERT_EXISTS=yes || true

            if [ "$CERT_EXISTS" != "yes" ]; then
              echo "admin.goairclass.com cert not found — bootstrapping..."
              cp nginx/nginx.conf nginx/nginx.conf.bak
              cp nginx/nginx-bootstrap.conf nginx/nginx.conf
              free_web_ports
              docker compose up -d --no-build --no-deps nginx
              sleep 5
              timeout 120 docker compose run --rm certbot certonly \
                --webroot -w /var/www/certbot \
                -d admin.goairclass.com \
                --email "$CERTBOT_EMAIL" --agree-tos --no-eff-email --non-interactive \
                || echo "WARNING: admin.goairclass.com cert issuance failed or timed out — check DNS/firewall. Site will retry next deploy."
              mv nginx/nginx.conf.bak nginx/nginx.conf
              free_web_ports
              docker compose up -d --no-build --no-deps nginx
            fi

            # Rolling restart with the real (SSL) config
            docker compose up -d --no-build --remove-orphans --no-recreate
            free_web_ports
            docker compose up -d --no-build --no-deps nginx

            # Cleanup old images
            docker image prune -f
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
